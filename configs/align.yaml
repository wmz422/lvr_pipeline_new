seed_everything: 42
trainer:
  accelerator: gpu
  devices: '4'
  precision: bf16-mixed
  max_epochs: 5
  val_check_interval: 1000
  limit_val_batches: 256.0
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  max_steps: 1000
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      filename: align-{epoch:03d}-{step:08d}
      monitor: val/ce_loss_epoch
      save_last: true
      save_top_k: 3
      save_weights_only: false
      mode: min
      auto_insert_metric_name: false
      save_on_train_epoch_end: false
      every_n_train_steps: 1000
  strategy: auto
model:
  learning_rate: 1.0e-06
  latent_projector_learning_rate: 0.0001
  qwen_learning_rate: 1.0e-06
  qwen_model_name_or_path: models/Qwen3-VL-4B-Instruct
  qwen_torch_dtype: bfloat16
  add_latent_special_tokens: true
  latent_pad_token: <abs_vis_token_pad>
  lam_checkpoint_path: models/lvr-sft-v3-4000/lam/lam.ckpt
  lam_vision_model_path: models/Qwen3-VL-4B-Instruct
  lam_model_dim: 1024
  lam_latent_dim: 32
  lam_patch_size: 16
  lam_enc_blocks: 16
  lam_dec_blocks: 16
  lam_num_heads: 16
  lam_num_latent: 4
  latent_projector_type: mlp
  latent_projector_mlp_hidden_dim: 1024
  latent_head: false
  train_qwen_lm: true
  train_qwen_lm_head: true
  train_latent_projector: true
  train_latent_head: false
  train_lam: false
  init_checkpoint_path: null
  qwen_gradient_checkpointing: true
  optimizer_name: adamw
  weight_decay: 0.0
  save_trainable_only: true
  loss_lambda: 0.0
  generation_mode: align
  generation_max_new_tokens: 64
  generation_output_append: false
data:
  train_path: data/align/train
  test_path: data/align/test
  image_root: data
  processor_name_or_path: models/Qwen3-VL-4B-Instruct
  batch_size: 8
  num_workers: 8
  max_length: 4096
  latent_len: 4
  lam_image_size: 512
  train_limit: null
  test_limit: null
  add_latent_special_tokens: true
  stage: align
  system_prompt: You are a helpful assistant.
  qwen_dynamic_resolution: true
  qwen_max_pixels: 2408448
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  build_shuffle_lam_inputs: false
exp_name: align
version: v2
